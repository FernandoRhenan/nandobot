server {

  listen 443 ssl;
  server_name <SUBSTITUA POR SEU DOMÍNIO> <www.SUBSTITUA POR SEU DOMÍNIO>;

  ssl_certificate_key /etc/letsencrypt/live/<SUBSTITUA POR SEU DOMÍNIO>/privkey.pem;
  ssl_certificate /etc/letsencrypt/live/<SUBSTITUA POR SEU DOMÍNIO>/fullchain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;

  location /socket.io/ {
    proxy_pass http://nextjs:3010;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://nextjs:3000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;
  }
}
